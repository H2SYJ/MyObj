basePath: /api
definitions:
  models.JsonResponse:
    properties:
      code:
        description: 状态码
        type: integer
      data:
        description: 数据
      message:
        description: 状态
        type: string
    type: object
  models.TagCategory:
    properties:
      builtin:
        type: boolean
      code:
        type: string
      color:
        type: string
      created_at:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      name:
        type: string
      sort_order:
        type: integer
      updated_at:
        type: string
    type: object
  models.TagRebuildFailure:
    properties:
      created_at:
        type: string
      error:
        type: string
      job_id:
        type: string
      retry_count:
        type: integer
      status:
        type: string
      uf_id:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  models.TagRebuildJob:
    properties:
      created_at:
        type: string
      cursor:
        type: string
      failed:
        type: integer
      finished_at:
        type: string
      id:
        type: string
      last_error:
        type: string
      processed:
        type: integer
      requested_by:
        type: string
      scope_id:
        type: string
      scope_type:
        type: string
      started_at:
        type: string
      status:
        type: string
      succeeded:
        type: integer
      target_version:
        type: integer
      total:
        type: integer
      updated_at:
        type: string
    type: object
  models.TagRule:
    properties:
      category_id:
        type: string
      created_at:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      pattern:
        type: string
      priority:
        type: integer
      replacement:
        type: string
      rule_set_id:
        type: string
      target_field:
        type: string
      type:
        type: string
      updated_at:
        type: string
      weight:
        type: number
    type: object
  models.TagRuleSet:
    properties:
      based_on_version:
        type: integer
      created_at:
        type: string
      created_by:
        type: string
      id:
        type: string
      published_at:
        type: string
      revision:
        type: integer
      rules:
        items:
          $ref: '#/definitions/models.TagRule'
        type: array
      scope_id:
        type: string
      scope_type:
        type: string
      status:
        type: string
      updated_at:
        type: string
      version:
        type: integer
    type: object
  request.AdminSaveTagDraftRequest:
    properties:
      revision:
        minimum: 1
        type: integer
      rules:
        items:
          $ref: '#/definitions/request.TagRuleInput'
        type: array
    required:
    - revision
    type: object
  request.AdminTagCategoryRequest:
    properties:
      code:
        type: string
      color:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      name:
        type: string
      sort_order:
        type: integer
    required:
    - code
    - name
    type: object
  request.AdminTagSettingsRequest:
    properties:
      enabled:
        type: boolean
      limit:
        maximum: 100
        minimum: 1
        type: integer
    required:
    - limit
    type: object
  request.BatchUpdateTagsRequest:
    properties:
      add:
        items:
          $ref: '#/definitions/request.ManualTagInput'
        type: array
      file_ids:
        items:
          type: string
        maxItems: 100
        minItems: 1
        type: array
      remove_tag_ids:
        items:
          type: string
        type: array
    required:
    - file_ids
    type: object
  request.CreateLocalFileDownloadRequest:
    properties:
      file_id:
        description: 文件ID
        type: string
      file_password:
        description: 文件解密密码（加密文件必需）
        type: string
    required:
    - file_id
    type: object
  request.DeleteApiKeyRequest:
    properties:
      api_key_id:
        description: API Key ID
        type: integer
    required:
    - api_key_id
    type: object
  request.DeleteDirRequest:
    properties:
      dir_id:
        description: 目录ID
        type: integer
    required:
    - dir_id
    type: object
  request.DeleteFileRequest:
    properties:
      file_ids:
        description: 文件ID列表
        items:
          type: string
        type: array
    required:
    - file_ids
    type: object
  request.DeleteRecycledRequest:
    properties:
      recycled_id:
        type: string
    required:
    - recycled_id
    type: object
  request.DeleteUploadTaskRequest:
    properties:
      task_id:
        description: 任务ID（预检ID）
        type: string
    required:
    - task_id
    type: object
  request.GenerateApiKeyRequest:
    properties:
      expires_days:
        description: 过期天数，0表示永不过期
        type: integer
    type: object
  request.MakeDirRequest:
    properties:
      name:
        type: string
      parent_id:
        minimum: 1
        type: integer
    required:
    - name
    - parent_id
    type: object
  request.ManualTagInput:
    properties:
      category_id:
        type: string
      name:
        type: string
      visibility:
        type: string
    required:
    - name
    type: object
  request.MoveFileRequest:
    properties:
      file_id:
        type: string
      target_directory_id:
        minimum: 1
        type: integer
    required:
    - file_id
    - target_directory_id
    type: object
  request.MoveItemsRequest:
    properties:
      directory_ids:
        items:
          type: integer
        type: array
      file_ids:
        items:
          type: string
        type: array
      target_directory_id:
        minimum: 1
        type: integer
    required:
    - target_directory_id
    type: object
  request.ParseTorrentRequest:
    properties:
      content:
        description: 种子文件内容（Base64编码）或磁力链接（magnet:开头）
        type: string
    required:
    - content
    type: object
  request.RenameDirRequest:
    properties:
      dir_id:
        description: 目录ID
        type: integer
      new_dir_name:
        description: 新目录名
        type: string
    required:
    - dir_id
    - new_dir_name
    type: object
  request.RenameFileRequest:
    properties:
      file_id:
        description: 文件ID（uf_id）
        type: string
      new_file_name:
        description: 新文件名
        type: string
    required:
    - file_id
    - new_file_name
    type: object
  request.RenewExpiredTaskRequest:
    properties:
      days:
        description: 延期天数（默认7天）
        type: integer
      task_id:
        description: 任务ID（预检ID）
        type: string
    required:
    - task_id
    type: object
  request.RestoreFileRequest:
    properties:
      recycled_id:
        type: string
    required:
    - recycled_id
    type: object
  request.SetFilePublicRequest:
    properties:
      file_id:
        description: 文件ID（uf_id）
        type: string
      public:
        description: 是否公开
        type: boolean
    required:
    - file_id
    type: object
  request.StartTorrentDownloadRequest:
    properties:
      content:
        description: 种子文件内容（Base64编码）或磁力链接
        type: string
      enable_encryption:
        description: 是否加密存储
        type: boolean
      file_indexes:
        description: 要下载的文件索引列表
        items:
          type: integer
        type: array
      file_password:
        description: 文件密码（加密文件必需）
        type: string
      save_path:
        description: 保存的虚拟路径（可选，默认为/离线下载/）
        type: string
    required:
    - content
    - file_indexes
    type: object
  request.TagPreviewRequest:
    properties:
      rules:
        items:
          $ref: '#/definitions/request.TagRuleInput'
        type: array
      samples:
        items:
          type: string
        maxItems: 100
        minItems: 1
        type: array
    required:
    - samples
    type: object
  request.TagRuleInput:
    properties:
      category_id:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      pattern:
        type: string
      priority:
        type: integer
      replacement:
        type: string
      target_field:
        type: string
      type:
        type: string
      weight:
        type: number
    required:
    - pattern
    - type
    type: object
  request.UpdateManualTagsRequest:
    properties:
      add:
        items:
          $ref: '#/definitions/request.ManualTagInput'
        type: array
      remove_tag_ids:
        items:
          type: string
        type: array
    type: object
  request.UpdatePersonalDictionaryRequest:
    properties:
      rules:
        items:
          $ref: '#/definitions/request.TagRuleInput'
        type: array
    type: object
  request.UpdateTagExclusionsRequest:
    properties:
      restore_tag_ids:
        items:
          type: string
        type: array
      suppress_tag_ids:
        items:
          type: string
        type: array
    type: object
  request.UploadPrecheckRequest:
    properties:
      chunk_signature:
        description: 文件hash签名
        type: string
      directory_id:
        description: 目录ID
        minimum: 1
        type: integer
      file_name:
        description: 文件名
        type: string
      file_size:
        description: 文件大小 字节
        type: integer
      files_md5:
        description: 文件分片的DM5列表
        items:
          type: string
        type: array
      user_id:
        type: string
    required:
    - directory_id
    type: object
  request.UserLoginRequest:
    properties:
      challenge:
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  request.UserRegisterRequest:
    properties:
      challenge:
        description: 挑战ID
        type: string
      email:
        type: string
      nickname:
        type: string
      password:
        type: string
      phone:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  request.UserUpdatePasswordRequest:
    properties:
      challenge:
        description: 挑战ID
        type: string
      id:
        type: string
      new_passwd:
        type: string
      old_passwd:
        type: string
    type: object
  request.UserUpdateRequest:
    properties:
      email:
        description: 用户邮箱
        type: string
      id:
        type: string
      nickname:
        description: 用户昵称
        type: string
      phone:
        description: 用户手机号
        type: string
      username:
        description: 用户名
        type: string
    type: object
  request.VideoPlayPrecheckRequest:
    properties:
      file_id:
        description: 文件ID
        type: string
      share_password:
        description: 分享密码（如果是分享链接访问）
        type: string
    required:
    - file_id
    type: object
  response.Breadcrumb:
    properties:
      absolute_path:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  response.CompactTagView:
    properties:
      category_code:
        type: string
      color:
        type: string
      id:
        type: string
      name:
        type: string
      visibility:
        type: string
    type: object
  response.DirectoryItem:
    properties:
      absolute_path:
        type: string
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      parent_id:
        type: integer
      updated_at:
        type: string
    type: object
  response.FileItem:
    properties:
      created_at:
        type: string
      file_id:
        type: string
      file_name:
        description: UfID         string               `json:"uf_id"` // 用户文件ID
        type: string
      file_size:
        type: integer
      has_thumbnail:
        description: 是否有缩略图
        type: boolean
      is_enc:
        type: boolean
      mime_type:
        type: string
      public:
        description: 是否公开
        type: boolean
      tag_state:
        type: string
      tags:
        items:
          $ref: '#/definitions/response.CompactTagView'
        type: array
    type: object
  response.FileListResponse:
    properties:
      breadcrumbs:
        description: 面包屑路径
        items:
          $ref: '#/definitions/response.Breadcrumb'
        type: array
      current_directory_id:
        description: 当前路径
        type: integer
      files:
        description: 文件列表
        items:
          $ref: '#/definitions/response.FileItem'
        type: array
      folders:
        description: 目录列表
        items:
          $ref: '#/definitions/response.FolderItem'
        type: array
      page:
        description: 当前页
        type: integer
      page_size:
        description: 每页数量
        type: integer
      total:
        description: 总数（目录+文件）
        type: integer
    type: object
  response.FileTagsResponse:
    properties:
      file_id:
        type: string
      last_error:
        type: string
      state:
        type: string
      suppressed:
        items:
          $ref: '#/definitions/response.TagView'
        type: array
      tags:
        items:
          $ref: '#/definitions/response.TagView'
        type: array
      updated_at:
        type: string
    type: object
  response.FolderItem:
    properties:
      absolute_path:
        type: string
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      parent_id:
        type: integer
    type: object
  response.ParseTorrentResponse:
    properties:
      files:
        description: 文件列表
        items:
          $ref: '#/definitions/response.TorrentFileInfo'
        type: array
      info_hash:
        description: InfoHash（种子唯一标识）
        type: string
      name:
        description: 种子名称
        type: string
      total_size:
        description: 总大小（字节）
        type: integer
    type: object
  response.StartTorrentDownloadResponse:
    properties:
      task_count:
        description: 创建的任务数量
        type: integer
      task_ids:
        description: 创建的任务ID列表
        items:
          type: string
        type: array
      torrent_name:
        description: 种子名称
        type: string
    type: object
  response.TagCategoryView:
    properties:
      code:
        type: string
      color:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  response.TagPreviewItem:
    properties:
      input:
        type: string
      tags:
        items:
          $ref: '#/definitions/response.CompactTagView'
        type: array
    type: object
  response.TagView:
    properties:
      automatic:
        type: boolean
      category:
        $ref: '#/definitions/response.TagCategoryView'
      id:
        type: string
      name:
        type: string
      sources:
        items:
          type: string
        type: array
      suppressed:
        type: boolean
      visibility:
        type: string
    type: object
  response.TorrentFileInfo:
    properties:
      index:
        description: 文件索引
        type: integer
      name:
        description: 文件名
        type: string
      path:
        description: 文件路径（种子内的相对路径）
        type: string
      size:
        description: 文件大小（字节）
        type: integer
    type: object
  response.UploadProgressResponse:
    properties:
      error_message:
        type: string
      file_id:
        type: string
      file_name:
        type: string
      file_size:
        type: integer
      is_complete:
        description: 是否已完成
        type: boolean
      is_enc:
        type: boolean
      md5:
        description: 已上传分片的MD5列表
        items:
          type: string
        type: array
      precheck_id:
        type: string
      progress:
        description: 进度百分比 (0-100)
        type: number
      stage:
        type: string
      status:
        type: string
      total:
        description: 总分片数
        type: integer
      uploaded:
        description: 已上传分片数
        type: integer
    type: object
  response.UploadTaskItem:
    properties:
      chunk_signature:
        description: 文件hash签名
        type: string
      chunk_size:
        description: 分片大小（字节）
        type: integer
      create_time:
        description: 创建时间
        type: string
      directory_id:
        description: 路径ID
        type: integer
      error_message:
        description: 错误信息
        type: string
      expire_time:
        description: 过期时间
        type: string
      file_name:
        description: 文件名
        type: string
      file_size:
        description: 文件大小（字节）
        type: integer
      id:
        description: 任务ID（precheck_id）
        type: string
      is_enc:
        description: 是否为加密文件
        type: boolean
      processing_stage:
        description: 后台处理阶段
        type: string
      progress:
        description: 上传进度（0-100）
        type: number
      result_file_id:
        description: 处理完成后的文件ID
        type: string
      status:
        description: 任务状态（pending/uploading/processing/completed/failed/aborted）
        type: string
      total_chunks:
        description: 总分片数
        type: integer
      update_time:
        description: 更新时间
        type: string
      uploaded_chunks:
        description: 已上传分片数
        type: integer
    type: object
  response.UploadTaskListResponse:
    properties:
      page:
        description: 当前页
        type: integer
      page_size:
        description: 每页数量
        type: integer
      tasks:
        description: 任务列表
        items:
          $ref: '#/definitions/response.UploadTaskItem'
        type: array
      total:
        description: 总数
        type: integer
    type: object
  response.VideoFileInfo:
    properties:
      file_id:
        description: 文件ID
        type: string
      file_name:
        description: 文件名
        type: string
      file_size:
        description: 文件大小（字节）
        type: integer
      is_enc:
        description: 是否加密
        type: boolean
      mime_type:
        description: MIME 类型
        type: string
    type: object
  response.VideoPlayTokenResponse:
    properties:
      file_info:
        allOf:
        - $ref: '#/definitions/response.VideoFileInfo'
        description: 文件信息
      play_token:
        description: 播放 Token（24小时有效）
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@myobj.com
    name: API Support
    url: https://gitee.com/MR-wind/my-obj.git/issues
  description: |-
    MyObj 是一个功能强大的文件存储系统，支持文件上传、下载、分享、回收站等功能
    支持大文件分片上传、秒传、文件加密等高级特性
  license:
    name: Apache-2.0
    url: https://opensource.org/licenses/Apache-2.0
  termsOfService: https://gitee.com/MR-wind/my-obj.git
  title: MyObj 文件存储系统 API
  version: "1.0"
paths:
  /admin/tag/categories:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.JsonResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.TagCategory'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: 获取全部标签分类
      tags:
      - 标签与词典管理
    post:
      consumes:
      - application/json
      parameters:
      - description: 标签分类
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.AdminTagCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.JsonResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.TagCategory'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.JsonResponse'
      security:
      - BearerAuth: []
      summary: 新增或更新标签分类
      tags:
      - 标签与词典管理
  /admin/tag/categories/{id}:
    delete:
      parameters:
      - description: 分类ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.JsonResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.JsonResponse'
      security:
      - BearerAuth: []
      summary: 删除自定义标签分类
      tags:
      - 标签与词典管理
  /admin/tag/drafts:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.JsonResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.TagRuleSet'
              type: object
      security:
      - BearerAuth: []
      summary: 创建或获取全局标签规则草稿
      tags:
      - 标签与词典管理
  /admin/tag/drafts/{id}:
    put:
      consumes:
      - application/json
      description: revision 不一致时返回 HTTP 409
      parameters:
      - description: 草稿ID
        in: path
        name: id
        required: true
        type: string
      - description: 草稿规则与revision
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.AdminSaveTagDraftRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.JsonResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.TagRuleSet'
              type: object
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.JsonResponse'
      security:
      - BearerAuth: []
      summary: 整体保存全局标签规则草稿
      tags:
      - 标签与词典管理
  /admin/tag/drafts/{id}/import:
    post:
      consumes:
      - application/json
      description: 仅接受 UTF-8 无 BOM 的 JSON 或 CSV，不会自动发布
      parameters:
      - description: 草稿ID
        in: path
        name: id
        required: true
        type: string
      - description: 草稿revision
        in: query
        name: revision
        required: true
        type: integer
      - default: json
        description: 导入格式
        enum:
        - json
        - csv
        in: query
        name: format
        type: string
      - description: JSON或CSV内容
        in: body
        name: file
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.JsonResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.TagRuleSet'
              type: object
        "400":
          description: Bad Request
          schema:
