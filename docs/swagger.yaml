      - 视频播放
securityDefinitions:
  ApiKeyAuth:
    description: API Key 身份验证
    in: header
    name: X-API-Key
    type: apiKey
  BearerAuth:
    description: 输入 "Bearer {token}" 进行身份验证
    in: header
    name: Authorization
    type: apiKey
