version: '1.0.0'

services:
  myobj:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myobj-server
    restart: unless-stopped
    ports:
      - "8080:8080"   # HTTP服务端口
      - "8081:8081"   # WebDAV服务端口
    volumes:
      # 配置文件挂载
      - ./config.toml:/app/config.toml:ro
      # 日志目录挂载
      - ./logs:/app/logs
      # 数据库目录挂载
      - ./libs:/app/libs
      # 文件数据目录挂载
      - ./obj_data:/app/obj_data
      # 临时文件目录挂载
      - ./obj_temp:/app/obj_temp
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      - redis
      # 启用下方 MySQL 服务并切换 config.toml 的数据库配置后，取消此行注释
      # - mysql
    networks:
      - myobj-network

  redis:
    image: redis:7-alpine
    container_name: myobj-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      # 冒号左侧为宿主机持久化目录，可按需修改
      - ./redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - myobj-network

  # MySQL 默认不启用。如需使用，请取消本服务和 myobj.depends_on 的注释，
  # 并同步切换 config.toml 中的数据库配置。
  # mysql:
  #   image: mysql:8.0
  #   container_name: myobj-mysql
  #   restart: unless-stopped
  #   ports:
  #     - "3306:3306"
  #   environment:
  #     - TZ=Asia/Shanghai
  #     - MYSQL_ROOT_PASSWORD=root_password
  #     - MYSQL_DATABASE=my_obj
  #     - MYSQL_USER=myobj
  #     - MYSQL_PASSWORD=password
  #   command:
  #     - --character-set-server=utf8mb4
  #     - --collation-server=utf8mb4_unicode_ci
  #   volumes:
  #     # 冒号左侧为宿主机持久化目录，可按需修改
  #     - ./mysql-data:/var/lib/mysql
  #     - ./sql/mysql/mysql_init.sql:/docker-entrypoint-initdb.d/mysql_init.sql:ro
  #   networks:
  #     - myobj-network

networks:
  myobj-network:
    driver: bridge
